name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest@0.9.152
      - name: cargo nextest run
        # --no-tests=warn: stub crates have no tests yet; the warning
        # disappears once Slice C lands real code. Revert to plain
        # `cargo nextest run --locked` at that point.
        run: cargo nextest run --locked --no-tests=warn
      - name: doctests (nextest skips these)
        run: cargo test --doc --locked

  doc:
    name: cargo doc (warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo doc
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny@0.22.0
      - name: cargo deny check
        run: cargo deny check

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, pinned in
      # the workflow so a re-published release asset fails the check.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks (release tarball + pinned sha256, no third-party action)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
      - name: gitleaks git
        run: $RUNNER_TEMP/bin/gitleaks git . --verbose --redact

  # r5 F5-10 / AGENTS.md §3: docs/ builds into an mdBook site on every
  # commit, and a broken internal link or anchor fails the build. External
  # links are deliberately not checked (no network flakiness here).
  mdbook:
    name: mdbook (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SUMMARY.md matches the Overview's document map
        run: python3 ops/docs-summary.py --check
      # mdbook-linkcheck 0.7.7 speaks the mdBook 0.4 renderer protocol, so
      # mdbook stays on 0.4.x. install-action verifies each prebuilt binary
      # against the sha256 in its manifest at the pinned action SHA.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: mdbook@0.4.52,mdbook-linkcheck@0.7.7
      - name: mdbook build (linkcheck renderer fails on missing link targets)
        run: mdbook build
      - name: internal anchors resolve in the built HTML
        run: python3 ops/docs-anchors.py target/book/html

  # r6 F6-13: prose must not contradict docs/facts.yaml.
  facts:
    name: docs facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prose vs docs/facts.yaml
        run: python3 ops/docs-facts.py

  # r5 F5-10 / AGENTS.md §3: the admin API is utoipa -> openapi.json, and
  # spec drift fails CI. STUB until Slice D gives oob-dac an API: it passes
  # while no openapi.json exists anywhere in the tree. Once Slice D lands,
  # this job generates the spec from the code (an oob-dac binary/test that
  # dumps the utoipa OpenApi doc) and diffs it against the committed
  # openapi.json; any difference fails. If an openapi.json appears before
  # that wiring does, the stub fails so the gap cannot go unnoticed.
  openapi:
    name: openapi drift (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generated vs committed openapi.json (stub)
        run: |
          set -euo pipefail
          found="$(find . -path ./target -prune -o -name '*openapi.json' -print)"
          if [ -z "$found" ]; then
            echo "no openapi.json committed yet (oob-dac has no API before Slice D): nothing to compare"
            exit 0
          fi
          echo "::error::openapi.json exists but the drift check is still a stub: wire generate-and-diff in this job (Slice D)"
          echo "$found"
          exit 1

  agent-guard:
    name: agent-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard self-test (AGENTS.md §14)
        run: python3 ops/agent-guard.py --self-test
      - name: every committed hook is wired, enabled, and blocks
        run: python3 ops/check-agent-hooks.py
