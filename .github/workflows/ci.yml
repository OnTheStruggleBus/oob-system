name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest@0.9.152
      - name: cargo nextest run
        run: cargo nextest run --locked
      - name: doctests (nextest skips these)
        run: cargo test --doc --locked

  doc:
    name: cargo doc (warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: cargo doc
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny@0.22.0
      - name: cargo deny check
        run: cargo deny check

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, pinned in
      # the workflow so a re-published release asset fails the check.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks (release tarball + pinned sha256, no third-party action)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
      - name: gitleaks git
        run: $RUNNER_TEMP/bin/gitleaks git . --verbose --redact

  # r5 F5-10 / AGENTS.md §3: docs/ builds into an mdBook site on every
  # commit, and a broken internal link or anchor fails the build. External
  # links are deliberately not checked (no network flakiness here).
  mdbook:
    name: mdbook (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SUMMARY.md matches the Overview's document map
        run: python3 ops/docs-summary.py --check
      # mdbook-linkcheck 0.7.7 speaks the mdBook 0.4 renderer protocol, so
      # mdbook stays on 0.4.x. install-action verifies each prebuilt binary
      # against the sha256 in its manifest at the pinned action SHA.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: mdbook@0.4.52,mdbook-linkcheck@0.7.7
      - name: mdbook build (linkcheck renderer fails on missing link targets)
        run: mdbook build
      - name: internal anchors (built HTML) + file links in root/role Markdown
        run: python3 ops/docs-anchors.py target/book/html
      # ARCH-1 / AGENTS.md §3: keep the site this run built, named by commit,
      # so the run cited as gate evidence carries the doc site. Attaching it
      # to a gate tag stays Marshal's manual step. actions/upload-artifact
      # v7.0.2, SHA resolved from the release tag (refs/tags/v7.0.2).
      - name: keep the built doc site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-site-${{ github.sha }}
          path: target/book/html
          if-no-files-found: error
          retention-days: 90

  # r6 F6-13: prose must not contradict docs/facts.yaml. Rules, scan set and
  # allowlist: ops/docs-facts.toml (tomllib needs Python 3.11+; the runner's
  # python3 is 3.12).
  facts:
    name: docs facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prose and crate doc comments vs docs/facts.yaml
        run: python3 ops/docs-facts.py

  # r5 F5-10 / AGENTS.md §3: the admin API is utoipa -> openapi.json, and
  # spec drift fails CI. STUB until Slice D gives oob-dac an API: it passes
  # while no OpenAPI spec exists anywhere in the tree. Once Slice D lands,
  # this job generates the spec from the code (an oob-dac binary/test that
  # dumps the utoipa OpenApi doc) and diffs it against the committed
  # openapi.json; any difference fails. If a spec (any case, .json/.yaml/
  # .yml) appears before that wiring does, the stub fails so the gap cannot
  # go unnoticed. The display name is final (ARCH-3): the required check is
  # matched by name, so Slice D changes the steps, never the name.
  openapi:
    name: openapi drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generated vs committed openapi.json (stub until Slice D)
        run: |
          set -euo pipefail
          found="$(find . -path ./target -prune -o -path ./.git -prune -o \( -iname '*openapi*.json' -o -iname '*openapi*.yaml' -o -iname '*openapi*.yml' \) -print)"
          if [ -z "$found" ]; then
            echo "stub: no OpenAPI spec committed yet (oob-dac has no API before Slice D): nothing to compare"
            exit 0
          fi
          echo "::error::an OpenAPI spec exists but the drift check is still a stub: wire generate-and-diff in this job (Slice D)"
          echo "$found"
          exit 1

  agent-guard:
    name: agent-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard self-test (AGENTS.md §14)
        run: python3 ops/agent-guard.py --self-test
      - name: every committed hook is wired, enabled, and blocks
        run: python3 ops/check-agent-hooks.py

  # #18 / r6 F6-15 / ADR-002 Option C: a fixed-length stream from the real
  # scheduler -> packetizer -> pacer (`gen_stream`, regenerated on every run,
  # nothing cached) is analyzed by tsduck as an independent oracle for section
  # syntax, CRC32, continuity and PID references. tsduck proves generic
  # MPEG-2 conformance ONLY: DCII/GI-private bits are unknown to it and not
  # thereby proven; d 15 / d 16 on a box stay the referee (r4 F4-6). Rules,
  # allowlist and self-test: ops/ci/tsduck-analyze.py.
  # The display name is final: it must be added to the required checks (an
  # owner action, AGENTS.md §6 rule 6), never before this job reports.
  tsduck:
    name: tsduck analyze
    # Pinned to the image the .deb below is built for (ubuntu24).
    runs-on: ubuntu-24.04
    env:
      TSDUCK_VERSION: 3.45-4798
      # sha256 of tsduck_${TSDUCK_VERSION}.ubuntu24_amd64.deb as published in
      # the GitHub release's asset digest; a re-published asset fails the check.
      TSDUCK_SHA256: 0023689f76e75b64e45253771208bcf8ca95b91fbfd0900da097c729f3c39fde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: install tsduck (release .deb + pinned sha256, no third-party action)
        run: |
          set -euo pipefail
          deb="tsduck_${TSDUCK_VERSION}.ubuntu24_amd64.deb"
          curl -sSfL "https://github.com/tsduck/tsduck/releases/download/v${TSDUCK_VERSION}/${deb}" -o "/tmp/${deb}"
          echo "${TSDUCK_SHA256}  /tmp/${deb}" | sha256sum --check -
          sudo apt-get update
          sudo apt-get install -y "/tmp/${deb}"
          tsp --version
      - name: generate the stream, analyze it, and prove the checker rejects corrupted copies
        run: python3 ops/ci/tsduck-analyze.py --self-test

  launcher-hardening:
    name: launcher hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: launcher prompt-injection hardening present and identical across launchers (AGENTS.md §6/§14)
        run: python3 ops/check-launcher-hardening.py
